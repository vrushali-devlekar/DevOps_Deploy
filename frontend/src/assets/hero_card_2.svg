<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="goldMatrixBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#261a06"/>
      <stop offset="50%" stop-color="#0f0a02"/>
      <stop offset="100%" stop-color="#040300"/>
    </radialGradient>

    <linearGradient id="goldCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="goldCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="goldCubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(250, 204, 21, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="800" rx="32" fill="url(#goldMatrixBg)"/>
  <rect width="800" height="800" rx="32" fill="url(#matrixGrid)"/>

  <!-- Outer Cybernetic Frame -->
  <rect x="20" y="20" width="760" height="760" rx="24" fill="none" stroke="rgba(250, 204, 21, 0.25)" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="728" rx="16" fill="none" stroke="rgba(234, 179, 8, 0.15)" stroke-width="1" stroke-dasharray="10 6"/>

  <!-- Golden Embers & Sparks Floating in Mid-Air -->
  <g filter="url(#goldGlow)">
    <rect x="140" y="160" width="8" height="8" fill="#fef08a"/>
    <rect x="220" y="280" width="6" height="6" fill="#facc15"/>
    <rect x="680" y="200" width="10" height="10" fill="#fef08a"/>
    <rect x="620" y="480" width="7" height="7" fill="#eab308"/>
    <rect x="180" y="580" width="9" height="9" fill="#facc15"/>
    <rect x="300" y="120" width="5" height="5" fill="#fef08a"/>
  </g>

  <!-- MAIN ISOMETRIC ANTIGRAVITY METALLIC BEDROCK PLATFORM -->
  <g transform="translate(400, 520)">

    <!-- Under Platform Glow -->
    <ellipse cx="0" cy="120" rx="280" ry="90" fill="rgba(250, 204, 21, 0.25)" filter="url(#goldGlow)"/>

    <!-- Bedrock Base -->
    <polygon points="-260,0 0,-110 260,0 0,110" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <polygon points="-260,0 0,110 0,170 -260,60" fill="#09090b" stroke="#18181b" stroke-width="2"/>
    <polygon points="0,110 260,0 260,60 0,170" fill="#18181b" stroke="#27272a" stroke-width="2"/>

    <!-- Metallic Circuit Traces on Bedrock -->
    <path d="M-180,-30 L-60,20 L0,0 L120,50 L200,15" fill="none" stroke="#facc15" stroke-width="2" filter="url(#goldGlow)"/>
    <path d="M-100,-70 L0,-20 L80,-60" fill="none" stroke="#a3e635" stroke-width="2" filter="url(#goldGlow)"/>

    <!-- FLOATING GOLDEN COMPUTING CUBES CLUSTER (WEIGHTLESS MATRIX) -->
    
    <!-- Central Large Golden Cube -->
    <g transform="translate(0, -140)" filter="url(#goldGlow)">
      <!-- Top Face -->
      <polygon points="0,-70 80,-110 160,-70 80,-30" fill="url(#goldCubeTop)" stroke="#fef08a" stroke-width="2"/>
      <!-- Left Face -->
      <polygon points="0,-70 80,-30 80,50 0,10" fill="url(#goldCubeLeft)" stroke="#facc15" stroke-width="2"/>
      <!-- Right Face -->
      <polygon points="80,-30 160,-70 160,10 80,50" fill="url(#goldCubeRight)" stroke="#ca8a04" stroke-width="2"/>
      
      <!-- Inner Glowing Core Symbol on Face -->
      <path d="M40,-20 L80,-40 L120,-20 L80,0 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Medium Floating Gold Cube Left -->
    <g transform="translate(-160, -200)" filter="url(#goldGlow)">
      <polygon points="0,-45 50,-70 100,-45 50,-20" fill="url(#goldCubeTop)"/>
      <polygon points="0,-45 50,-20 50,30 0,05" fill="url(#goldCubeLeft)"/>
      <polygon points="50,-20 100,-45 100,05 50,30" fill="url(#goldCubeRight)"/>
    </g>

    <!-- Medium Floating Gold Cube Right -->
    <g transform="translate(100, -240)" filter="url(#goldGlow)">
      <polygon points="0,-40 45,-62 90,-40 45,-18" fill="url(#goldCubeTop)"/>
      <polygon points="0,-40 45,-18 45,25 0,03" fill="url(#goldCubeLeft)"/>
      <polygon points="45,-18 90,-40 90,03 45,25" fill="url(#goldCubeRight)"/>
    </g>

    <!-- Small Floating Satellite Cubes -->
    <g transform="translate(-80, -320)" filter="url(#goldGlow)">
      <polygon points="0,-25 30,-40 60,-25 30,-10" fill="#fef08a"/>
      <polygon points="0,-25 30,-10 30,20 0,05" fill="#facc15"/>
      <polygon points="30,-10 60,-25 60,05 30,20" fill="#eab308"/>
    </g>

    <g transform="translate(140, -100)" filter="url(#goldGlow)">
      <polygon points="0,-20 25,-32 50,-20 25,-08" fill="#fef08a"/>
      <polygon points="0,-20 25,-08 25,15 0,03" fill="#facc15"/>
      <polygon points="25,-08 50,-20 50,03 25,15" fill="#ca8a04"/>
    </g>

    <!-- Glowing Circuit Reflections & Fragmented Pixel Debris -->
    <rect x="-220" y="-80" width="12" height="12" fill="#facc15" filter="url(#goldGlow)"/>
    <rect x="200" y="-140" width="10" height="10" fill="#fef08a" filter="url(#goldGlow)"/>
    <rect x="-40" y="-280" width="8" height="8" fill="#ffffff" filter="url(#goldGlow)"/>
  </g>
</svg>