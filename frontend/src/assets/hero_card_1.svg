<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="voidBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#180b28"/>
      <stop offset="50%" stop-color="#0a0414"/>
      <stop offset="100%" stop-color="#030107"/>
    </radialGradient>

    <radialGradient id="portalPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>

    <filter id="purpleGlowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="35" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="cardGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(192, 132, 252, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="800" rx="32" fill="url(#voidBg)"/>
  <rect width="800" height="800" rx="32" fill="url(#cardGrid)"/>

  <!-- Outer Cybermatic Frame -->
  <rect x="20" y="20" width="760" height="760" rx="24" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="728" rx="16" fill="none" stroke="rgba(163, 230, 53, 0.15)" stroke-width="1" stroke-dasharray="12 6"/>

  <!-- Distant Cyan Stardust & Floating Crystals -->
  <g filter="url(#greenNeon)">
    <circle cx="160" cy="180" r="3" fill="#38bdf8"/>
    <circle cx="650" cy="140" r="4" fill="#a3e635"/>
    <circle cx="690" cy="520" r="3" fill="#c084fc"/>
    <circle cx="120" cy="620" r="4" fill="#e879f9"/>
    
    <!-- Neon Wireframe Fragments -->
    <polygon points="120,240 160,220 200,240 160,260" fill="none" stroke="#a3e635" stroke-width="1.5"/>
    <polygon points="620,600 660,580 700,600 660,620" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- ISOMETRIC FLOATING OBSIDIAN ISLAND -->
  <g transform="translate(400, 480)">

    <!-- Shadow / Under-glow on Void -->
    <ellipse cx="0" cy="140" rx="260" ry="90" fill="rgba(147, 51, 234, 0.35)" filter="url(#purpleGlowEffect)"/>

    <!-- Bottom Severed Obsidian Crags (Underside of Floating Island) -->
    <polygon points="0,80 -120,20 -180,60 -80,150" fill="#090511" stroke="#1e112a" stroke-width="2"/>
    <polygon points="0,80 120,20 180,60 80,150" fill="#120924" stroke="#2a1647" stroke-width="2"/>
    <polygon points="-80,150 0,80 80,150 0,220" fill="#1c0d38" stroke="#3b1973" stroke-width="2"/>

    <!-- Main Island Bedrock Body (Isometric Voxel Blocks) -->
    <!-- Left Face -->
    <polygon points="-240,0 0,100 0,160 -240,60" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,100 240,0 240,60 0,160" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
    <!-- Top Face (Obsidian Base) -->
    <polygon points="-240,0 0,-100 240,0 0,100" fill="#09090b" stroke="#27272a" stroke-width="2"/>

    <!-- Obsidian Surface Pixel Detail Grid -->
    <polygon points="-180,-25 0,-100 180,-25 0,50" fill="#140926" stroke="#2e1065" stroke-width="1.5"/>

    <!-- NETHER PORTAL CORE (VERTICAL ISOMETRIC PORTAL FRAME) -->
    <g transform="translate(0, -110)">
      
      <!-- Outer Portal Frame (Obsidian Pillars) -->
      <!-- Left Pillar -->
      <polygon points="-110,30 -70,10 -70,-170 -110,-150" fill="#1e1b4b" stroke="#312e81" stroke-width="2"/>
      <polygon points="-70,10 -30,30 -30,-150 -70,-170" fill="#312e81" stroke="#4338ca" stroke-width="2"/>
      <polygon points="-110,-150 -70,-170 -30,-150 -70,-130" fill="#4338ca" stroke="#6366f1" stroke-width="2"/>

      <!-- Right Pillar -->
      <polygon points="30,30 70,10 70,-170 30,-150" fill="#1e1b4b" stroke="#312e81" stroke-width="2"/>
      <polygon points="70,10 110,30 110,-150 70,-170" fill="#312e81" stroke="#4338ca" stroke-width="2"/>
      <polygon points="30,-150 70,-170 110,-150 70,-130" fill="#4338ca" stroke="#6366f1" stroke-width="2"/>

      <!-- Top Arch Bar -->
      <polygon points="-110,-150 110,-150 110,-190 -110,-190" fill="#312e81" stroke="#4338ca" stroke-width="2"/>
      <polygon points="-70,-130 70,-130 70,-150 -70,-150" fill="#4338ca"/>

      <!-- INNER GLOWING PORTAL CORE (PULSING PURPLE DIMENSIONAL VOID) -->
      <rect x="-65" y="-145" width="130" height="170" rx="12" fill="url(#portalPurple)" filter="url(#purpleGlowEffect)"/>

      <!-- Dimensional Swirls & Energy Runes -->
      <path d="M-40,-120 C-10,-140 30,-100 40,-60 C50,-20 -20,10 0,20" fill="none" stroke="#f0abfc" stroke-width="3" filter="url(#purpleGlowEffect)"/>
      <circle cx="0" cy="-60" r="24" fill="#ffffff" filter="url(#purpleGlowEffect)" opacity="0.9"/>

      <!-- Neon Green Wireframe Fragments Floating Around Core -->
      <g filter="url(#greenNeon)">
        <polygon points="-140,-80 -110,-95 -80,-80 -110,-65" fill="none" stroke="#a3e635" stroke-width="2"/>
        <polygon points="90,-120 120,-135 150,-120 120,-105" fill="none" stroke="#a3e635" stroke-width="2"/>
        <polygon points="-130,20 -100,5 -70,20 -100,35" fill="#a3e635" opacity="0.8"/>
      </g>
    </g>

    <!-- Weightlessly Drifting Black Obsidian Cubes -->
    <g transform="translate(-190, -180)" filter="url(#purpleGlowEffect)">
      <polygon points="0,0 30,-15 60,0 30,15" fill="#c084fc"/>
      <polygon points="0,0 30,15 30,45 0,30" fill="#9333ea"/>
      <polygon points="30,15 60,0 60,30 30,45" fill="#7e22ce"/>
    </g>

    <g transform="translate(160, -220)" filter="url(#greenNeon)">
      <polygon points="0,0 25,-12 50,0 25,12" fill="#a3e635"/>
      <polygon points="0,0 25,12 25,35 0,23" fill="#65a30d"/>
      <polygon points="25,12 50,0 50,23 25,35" fill="#4d7c0f"/>
    </g>

  </g>
</svg>